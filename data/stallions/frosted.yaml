name: Frosted
profile:
  fee_current: $12,500
  sire: Tapit
  dam: Fast Cookie
  damsire: Deputy Minister
  year_foaled: 2012 (14yo)
  height: 16.1½ hh
  earnings: $3.9M
  entered_stud: '2017'
  first_crop_note: First crop are 8-year-olds
general:
- Fastest-ever G1 Met Mile winner (1:32.73), by the largest margin in the history of the race — 14¼ lengths.
- His 123 Beyer in the Met Mile is the highest ever recorded at a mile.
- His Met Mile received the fastest Thoro-Graph number ever given — a negative 8.5. Never unsound in 3 years of racing.
more_selling_points:
- 9 GSWs in Northern Hemisphere including FLOOD ZONE (G3W G1p), POST TIME (G2W G1p), TRAVEL COLUMN, ICE DANCING, FROST AT DAWN.
pedigree_highlights:
- His dam is a G2 winning half-sister to champion 2yo Midshipman (sire of 50+ NH Stakes Winners).
career:
  at_four:
    items:
    - Won G2 Maktoum Challenge R2 by 5 lengths, Won G1 Metropolitan Mile in stakes record time (1:32.73), Won G1 Whitney (107 Beyer).
  at_three:
    items:
    - Won G1 Wood Memorial (103 Beyer), 4th G1 Kentucky Derby (100), 2nd G1 Belmont (98), 3rd G1 Travers (102), Won G2 Pennsylvania Derby (106).
progeny:
- 'FROST AT DAWN (5f): 3rd G1 Nunthorpe Stakes at York; 2nd G1 King Charles III Stakes at Royal Ascot; won Cecil Frail Listed Stakes at Haydock.'
- 'POST TIME (6h): won Robert T. Manfuso S. at Laurel (110 Beyer); won G3 Blame S.; 2nd G1 BC Dirt Mile (102); 3rd G1 Whitney (105).'
- 'FLOOD ZONE (4c): won G3 Gotham S. at Aqueduct (98 Beyer).'
- 'MERINGUE (3f): won KY Downs Juvenile Fillies S. (68); 2nd G3 Adirondack at Saratoga (78).'
- 'DRAFT: FROSTY VIEW (5g): won Brooks Fields Mile S. at CBY 6/27 (92). Joel Berndt.'
