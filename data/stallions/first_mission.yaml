general:
- Four Graded Stakes wins and six triple-digit Beyers.
- His 109 Beyer makes him the fastest freshman to retire for $10k or less in the past five years.
pedigree_highlights:
- By sire of sires Street Sense, whose sons at stud include Maxfield, Speaker's Corner, and McKinzie.
- Free of A.P. Indy - Street Sense's best cross.
- Out of the Medaglia d'Oro mare Elude, a daughter of Argentinian champion 3yo filly FORTY MARCHANTA.
career:
  at_five:
    items:
    - Won the $1 million G2 Oaklawn Handicap by 2 (109 Beyer).
    - 3rd in the G1 Stephen Foster to Mindframe and Sierra Leone, beating Ky Derby winner Mystik Dan and Dubai World Cup winner Hit Show.
  at_four:
    items:
    - Won the G3 Essex at Oaklawn by 5 (100 Beyer).
    - Won G2 Alysheba at Churchill by 4 (106 Beyer).
  at_three:
    items:
    - Won the G3 Lexington Stakes at Keeneland (99 Beyer).
