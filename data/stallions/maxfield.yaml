name: Maxfield
profile:
  fee_current: 50000
  sire: Street Sense
  dam: Velvety
  damsire: Bernardini
  year_foaled: 2017 (9yo)
  height: 16.3½ hh
  earnings: $2M
  entered_stud: 2022
  first_crop_note: First crop are 3-year-olds
more_selling_points:
- First-crop two-year-olds in 2025 brought $1.25m, $1m, €1m. Plus two $1m first-crop yearlings. Only American Pharoah and Flightline have ever had more first-crop seven-figure sales horses.
pedigree_highlights:
- Out of a Bernardini mare who is also the dam of 2024 Graded winner LOVED (Beyers of 94, 92, 91, 90). Half-sister to Sky Mesa (sire of 5 champions, 26 GSWs).
- By the sire of 2024 freshman sire sensation McKinzie (4 Grade 1 2yos in his first crop).
career:
  at_four:
    items:
    - Won the G1 Clark (99), G2 Stephen Foster (103), G2 Alysheba (105), G3 Mineshaft (99), 2nd G1 Whitney (105). Never ran a Beyer under 95 after his 2yo season.
    - The only horse ever to win the Alysheba, Stephen Foster, and Clark in one season.
  at_three:
    items:
    - Won the G3 Matt Winn (95 Beyer).
  at_two:
    items:
    - Won on debut at Churchill, then won the G1 Breeders' Futurity at Keeneland by 5.5 lengths.
progeny:
- 'ENGLISHMAN (3c): Won G1 Woody Stephens - 115 Beyer is the highest of the year! TDN Rising Star. Won MSW by 7 on debut at CD 9/19 (97 Beyer); won ALW by 7 at FG 3/19 (95 Beyer); 2nd G2 Pat Day Mile on Derby Day (94). Cherie DaVaux. $400k KeeSep.'
- 'MASHALLAH (3f): TDN Rising Star won by 4 on debut at Kee 4/23. Her 106 Beyer is the best debut Beyer for a filly in 25 years! Won AOC at Sar 7/4 by 7 (96). Brendan Walsh. $1.25m OBS 2yo.'
- 'LIBERTY NATIONAL (3c): TDN Rising Star. 2nd Gun Runner at FG; won MSW by 4 at CD. TDN Derby Dozen.'
- 'MAGNA VICTOR (3c): TDN Rising Star. Won WFA Newcomer Race in Japan by 10 lengths.'
- 'FIVE BARS (3f): TDN Rising Star. 3rd G1 Frizette (72). Won MSW on debut at Saratoga.'
- 'IVY GIRL (3f): won Weber City Miss at Laurel 4/18 (70); won Main Line S. at Parx 3/3 (62).'
- 'DANON BOURBON (3c): won Fukuryu Stakes. 5th in Ky Derby.'
- "HOLLY'S HOLIDAY (3f): won Valley of the Vapors at Oaklawn 4/18 (76). "
- 'SABINO CANYON (3c): won Los Al Derby 6/27 (85). Baffert/ Three Amigos.'
- 'DRAFT: ENGLISHMAN (3c): won G1 Woody Stephens S. by 5 3/4 at SAR 6/6 (115). Cherie DeVaux.'
- "DRAFT: IVY GIRL (3f): 3rd Listed Lady's Secret S. at MTH 6/21 (75). Amelia J. Green."
