    items:
    - Won the G1 Clark (99), G2 Stephen Foster (103), G2 Alysheba (105), G3 Mineshaft (99), 2nd G1 Whitney (105) and G1 Woodward (105). Never ran a Beyer under 95 after his 2yo season.
    - The only horse ever to win the Alysheba, Stephen Foster, and Clark in one season.
  at_three:
    items:
    - Won the G3 Matt Winn (95 Beyer).
  at_two:
    items:
    - Won on debut at Churchill, then won the G1 Breeders' Futurity at Keeneland by 5.5 lengths.
