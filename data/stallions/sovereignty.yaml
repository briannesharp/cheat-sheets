name: Sovereignty
# Facts & Stats: shown only until his darleyamerica.com page is live, then the
# page's own selling points replace these automatically.
facts_and_stats:
- The 2025 Horse of the Year
- Brilliant winner of the Kentucky Derby, Belmont Stakes, and Travers (by 10 lengths!) at three, and added the G1 Whitney at four. The only horse ever to take the Kentucky Derby, Travers, and Whitney.
- A 115 Beyer in the Travers and a 112 in the Whitney - he's the fastest son of Into Mischief.
- Joins roster-mate Street Sense as the only Kentucky Derby winner to take the Travers in the past 30 years.
general:
- Won 7 of 12 starts, including 4 G1s, and earned $6.9M. Seven triple-digit Beyers.
- Bred by Godolphin and trained by Bill Mott.
pedigree_highlights:
- Second dam MUSHKA (by Empire Maker) won the G1 Spinster, G2 Demoiselle and G3 Glens Falls, and was 2nd in the G1 Breeders' Cup Ladies' Classic.
- His dam CROWNED is by Bernardini, like the dams of roster-mates Knightsbridge, Maxfield and Speaker's Corner. Her 2024 colt ROYAL CONQUEST is by roster-mate Nyquist.
career:
  at_two:
    items:
    - Won the G3 Street Sense S. at Churchill Downs by 5 lengths (87). 2nd by a quarter-length in a MSW at Belmont at the Big A.
  at_three:
    subtitle: HORSE OF THE YEAR, Champion 3YO Male
    items:
    - Won the G2 Fountain of Youth at Gulfstream (95). 2nd G1 Florida Derby.
    - Won the G1 Kentucky Derby by 1½ lengths (104) and the G1 Belmont S. at Saratoga by 3 (109).
    - Won the G2 Jim Dandy (104) and the G1 Travers by 10 lengths, earning a 115 Beyer.
  at_four:
    items:
    - 2nd G2 Oaklawn H. (108). 3rd G1 Stephen Foster (106).
    - Won the G1 Whitney at Saratoga by 4¾ lengths, earning a 112 Beyer.
