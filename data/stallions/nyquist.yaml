more_selling_points:
- 11 G1 juveniles from his first 6 crops — only Danzig ever had more.
- Four G1 winners and 10 G1 horses in 2025 - only Into Mischief had more. His 4% G1 horses from starters in 2025 was best among all stallions.
- 12 Graded Stakes winners in 2025 - best among all stallions under $250k - including G1 Breeders' Cup Dirt Mile winner Nysos, G1 winners Cavalieri, Velocity, and Argos, plus G2 Los Al Futurity winner Litmus Test, G2 Royal Ascot winner Crimson Advocate, G3 winner Knightsbridge, and G1 Preakness and Haskell runner-up Gosger.
