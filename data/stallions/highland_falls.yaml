name: Highland Falls
profile:
  fee_current: 10000
  sire: Curlin
  dam: Round Pond
  damsire: Awesome Again
  year_foaled: 2020 (6yo)
  height: 16.2 hh
  earnings: $1.6M
  entered_stud: 2026
  first_crop_note: Enters stud 2026 — NEW
pedigree_highlights:
- Curlin's only G1-winning son out of a multiple G1-winning mare.
- Out of G1 Breeders' Cup Distaff winner and G1 Acorn winner ROUND POND.
- Half-brother to G1 winner Long River, and to Tyburn Brook, dam of G1W Speaker's Corner and G3W Knightsbridge.
career:
  at_five:
    items:
    - Won a one-mile allowance at Aqueduct by 5.5 lengths (98 Beyer).
    - Runner-up by a length to Sierra Leone in the G1 Whitney, running a 107 Beyer and beating G1 winners Fierceness and White Abarrio.
    - 3rd in the G1 Jockey Club Gold Cup to Antiquarian and Sierra Leone, beating White Abarrio.
  at_four:
    items:
    - 2nd in the G2 Oaklawn Handicap (104 Beyer).
    - Won G3 Blame at Churchill (98 Beyer).
    - Brilliant four-length winner of the G1 Jockey Club Gold Cup, like his sire Curlin, running a 104 Beyer and beating three G1 winners (Tapit Trice, Arthur's Ride, Bright Future).
  at_three:
    items:
    - Won on debut at Ellis Park and a Churchill allowance (98 Beyer).
