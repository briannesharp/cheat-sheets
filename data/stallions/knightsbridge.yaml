name: Knightsbridge
# Facts & Stats: shown only until his darleyamerica.com page is live, then the
# page's own selling points replace these automatically.
facts_and_stats:
- His 122 Beyer Speed Figure for his 10-length victory in the G3 Monmouth Cup is the best figure since Flightline.
- Five Graded Stakes wins and six triple-digit Beyers, including the G1 Pacific Classic by six lengths and an 11-length win in the G3 Gulfstream Park Mile earning a 112 Beyer.
- The fastest son of Nyquist, out of a Bernardini daughter of G1 Breeders' Cup Distaff and G1 Acorn winner Round Pond. His dam is a half-sister to G1 Jockey Club Gold Cup winner Highland Falls and is also the dam of G1 winner Speaker's Corner.
general:
- Won 8 of 12 starts, including 5 graded stakes, and earned $1.5M. Three wins by 10 lengths or more.
- Bred by Godolphin and trained by Bill Mott.
pedigree_highlights:
- Out of TYBURN BROOK (by Bernardini), dam of G1 Carter winner and roster-mate Speaker's Corner.
- Second dam ROUND POND won the G1 Breeders' Cup Distaff and G1 Acorn. She is also the dam of G1 Jockey Club Gold Cup winner Highland Falls and G1 Al Maktoum Challenge Round 3 winner Long River.
career:
  at_two:
    items:
    - Won his debut, a 7f MSW at Churchill Downs, by 10½ lengths (92).
  at_three:
    items:
    - Won a 1-mile allowance at Gulfstream by 9 lengths (96). 3rd G3 Perryville at Keeneland (97).
  at_four:
    items:
    - Won a 7f allowance at Aqueduct (98) and the G3 Mr. Prospector at Gulfstream by 4¾ lengths (104).
  at_five:
    items:
    - Won the G3 Fred W. Hooper by 4¾ lengths (105) and the G3 Gulfstream Park Mile by 11¼ (112). 2nd G1 Metropolitan H. (102).
    - Won the G3 Monmouth Cup by 10¼ lengths, earning a 122 Beyer, and the G1 Pacific Classic at Del Mar by 6¼ (104).
