name: Proxy
profile:
  fee_current: 12500
  sire: Tapit
  dam: Panty Raid
  damsire: Include
  year_foaled: 2018 (8yo)
  height: 16.3 hh
  earnings: $2.8M
  entered_stud: 2024
  first_crop_note: First crop are yearlings
more_selling_points:
- First mares included 1 G1W, 5 GW, 12 SW, 26 SH and dams of 0 G1W, 2 GW, 16 SW, 33 SH
pedigree_highlights:
- Tapit's only G1-winning son out of a multiple G1-winning mare.
- Out of multiple G1 winner PANTY RAID — a GSW winner on dirt, turf, and all-weather of over $1-million.
- Half-brother to GSW MICHELINE (94 Beyer; set new course record at Kentucky Downs).
- With no Storm Cat in his pedigree, a good cross for mares from that line (15% of Tapit's G1 winners).
career:
  at_five:
    items:
    - Won the $1m G2 Oaklawn Handicap (103 Beyer) over Last Samurai and Stilleto Boy.
    - Won the G3 Monmouth Cup S. (96 Beyer) by 2½ lengths.
    - 2nd by a nose in the G1 Jockey Club Gold Cup (103 Beyer). 3rd in the G1 Breeders' Cup Classic (103 Beyer).
    - Beat 21 G1 winners including White Abarrio, Arabian Knight, Cyberknife, and Mandaloun. Won or placed in 11 Graded Stakes.
  at_four:
    items:
    - Won the G1 Clark Stakes (101 Beyer) over G1 winner West Will Power. 2nd G2 New Orleans Classic; 3rd G2 Stephen Foster.
  at_three:
    items:
    - 2nd in the G2 Risen Star (97 Beyer) to Kentucky Derby winner Mandaloun; 2nd in the G3 Lecomte S. (91 Beyer).
  at_two:
    items:
    - Broke maiden at Fair Grounds by 2 lengths running an 80 Beyer.
auto_bullets:
- 2025 weanlings bring $135k.
