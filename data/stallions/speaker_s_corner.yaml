name: Speaker's Corner
profile:
  fee_current: 10000
  sire: Street Sense
  dam: Tyburn Brook
  damsire: Bernardini
  year_foaled: 2018 (8yo)
  height: 16.1½ hh
  earnings: $740k
  entered_stud: 2023
  first_crop_note: First crop are 2yos
more_selling_points:
- 'First yearlings in 2025: 17 sold for $100k+!'
pedigree_highlights:
- Half-brother to G3 winner and TDN Rising Star KNIGHTSBRIDGE (by Nyquist). His dam is a half-sister to G1 Jockey Club Gold Cup winner Highland Falls.
- Bred on the same cross as star freshman Maxfield. Out of a Bernardini daughter of G1 Breeders' Cup Distaff and G1 Acorn winner Round Pond.
career:
  at_four:
    items:
    - Won the G3 Fred Hooper at Gulfstream (102) and the G2 Gulfstream Park Mile by 5 (106).
    - Won the G1 Carter by 4½ lengths, earning a 114 Beyer — the fastest in six years, after Flightline & Sovereignty. Ran 7 triple-digit Beyers.
  at_three:
    items:
    - Won a 7f allowance at Saratoga by 5 lengths, earning a 101 Beyer.
    - Won an 8.5f allowance at Belmont by 6¾ lengths, earning a 109 Beyer — matching the best 3yo Beyer by all three Eclipse Champion 3yo finalists that year.
  at_two:
    items:
    - Won a MSW at Belmont, beating 5 future Stakes winners including G2Ws Greatest Honour and Bourbonic, and Caddo River.
progeny:
- "HARPER'S CORNER (2f): 2 for 2. won MSW on debut at Laurel by 8 (56) then won Schuyerville at Saratoga by 5 (88)."
- "DRAFT: HARPER'S CORNER (2f): won Listed Schuylerville S. by 5 1/4 at SAR 7/3 (88). Cathal A. Lynch."
