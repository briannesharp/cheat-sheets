more_selling_points:
- First mares included 2 G1W, 18 GW, 53 SW, 89 SH and dams of 3 G1W, 29 GW, 51 SW, 63 SH
pedigree_highlights:
- Out of G1 winner and G1 BC Filly & Mare Sprint third, DANCE CARD (by Tapit), the 2023 Broodmare of the Year, from the La Troienne family.
- Curlin's only five-time G1-winning son.
career:
  at_five:
    subtitle: HORSE OF THE YEAR, Champion Older Dirt Male
    items:
    - Won the G1 Churchill Downs Stakes, earning a 105 Beyer and a 3.5 Ragozin.
    - Won the G1 Met Mile, earning a 112 Beyer (highest in 2023) and lifetime best 2.25 Ragozin.
    - Won the G2 Vosburgh, earning a 100 Beyer.
  at_four:
    items:
    - Won the G3 Westchester going a mile at Belmont by five, earning a 104 Beyer.
    - Won the Hanshin Stakes at Churchill, earning a 102 Beyer.
    - Won the G1 Forego at Saratoga beating Jackie's Warrior, earning a 112 Beyer and a 3½ Ragozin.
    - Won the G1 Breeder's Cup Dirt Mile, earning a 106 Beyer and a 2.75 Ragozin.
  at_three:
    items:
    - Broke his maiden at Churchill Downs in October earning a 92 Beyer.
    - Won back-to-back allowances at Churchill in November, earning a 92 and a 91 Beyer.
