general:
- Four wins and never out of the top three in 9 starts.
- "Spent 14 consecutive weeks at #1 on the NTRA Top Thoroughbred Poll. Rated #1 on the Longines World's Best Racehorse Rankings after the Dubai World Cup."
- Won the Dubai World Cup in faster time than Arrogate or California Chrome.
more_selling_points:
- 'First yearlings in 2025: 10 sold for $100k+! '
pedigree_highlights:
- Dam MUSIC NOTE is a five-time G1 winner by A.P. Indy, half-sister to MUSICAL CHIMES (G1 Classic in France and G1 winner in the US).
- From the family of Champion two-year-old filly It's In The Air and 2,000 Guineas winner Coroebus.
career:
  at_four:
    items:
    - Won G3 Razorback at Oaklawn by 6 (108 Beyer). Won G1 Dubai World Cup by almost 4 lengths. 2nd G2 Suburban.
  at_three:
    items:
    - TDN Rising Star winning by 5 at Fair Grounds in March. Won G2 Jim Dandy. 2nd G1 Jockey Club Gold Cup.
auto_bullets:
- 2026 2yos in training bring $480k (Novogratz Racing Stables), $290k (Marquee Bloodstock), $210k (Willis Horton Racing), $150k (Harmash Racing), $100k (Michael V. Pino).
- 2025 yearlings bring $425k (The Three Amigos), $300k (Champions Farm), $245k (Legion Bloodstock), $210k (Sabby Racing), $180k (Vince Foglia), $150k (Deacon Bloodstock), $150k (Saratoga Glen Farm), $150k (Faris Breeding), $140k (Redwings), $140k (Thorostock).
