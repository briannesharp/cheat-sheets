pedigree_highlights:
- Dam MUSIC NOTE is a five-time G1 winner by A.P. Indy, half-sister to MUSICAL CHIMES (G1 Classic in France and G1 winner in the US).
- From the family of Champion two-year-old filly It's In The Air and 2,000 Guineas winner Coroebus.
