name: Essential Quality
profile:
  fee_current: 25000
  sire: Tapit
  dam: Delightful Quality
  damsire: Elusive Quality
  year_foaled: 2018 (8yo)
  height: 16.2½ hh
  earnings: $4.9M
  entered_stud: 2022
  first_crop_note: First crop are 3-year-olds
general:
- Champion 2yo colt of 2020 and Champion 3yo colt of 2021 — one of only 7 colts in Eclipse Award history to be Champion at both 2 and 3.
- The only BC Juvenile winner ever to win the Belmont.
more_selling_points:
- Retired sound, never missed a day of training, never received Lasix.
pedigree_highlights:
- Tapit's all-time leading money earner.
- From the La Troienne family, like roster mates Cody's Wish and Maxfield.
career:
  at_three:
    subtitle: Champion 3YO Male
    items:
    - Won G1 Belmont, G1 Travers, G2 Blue Grass, G2 Jim Dandy, G3 Southwest, 3rd G1 BC Classic, 4th KY Derby.
  at_two:
    subtitle: Champion 2YO Male
    items:
    - Undefeated, won G1 Breeders' Futurity and G1 Breeder's Cup Juvenile.
