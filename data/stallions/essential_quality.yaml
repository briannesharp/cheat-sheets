name: Essential Quality
profile:
  fee_current: 25000
  sire: Tapit
  dam: Delightful Quality
  damsire: Elusive Quality
  year_foaled: 2018 (8yo)
  height: 16.2½ hh
  earnings: $4.9M
  entered_stud: 2022
  first_crop_note: First crop are 3-year-olds
general:
- Champion 2yo colt of 2020 and Champion 3yo colt of 2021 — one of only 7 colts in Eclipse Award history to be Champion at both 2 and 3.
- The only BC Juvenile winner ever to win the Belmont.
more_selling_points:
- Retired sound, never missed a day of training, never received Lasix.
pedigree_highlights:
- Tapit's all-time leading money earner.
- From the La Troienne family, like roster mates Cody's Wish and Maxfield.
career:
  at_three:
    subtitle: Champion 3YO Male
    items:
    - Won G1 Belmont, G1 Travers, G2 Blue Grass, G2 Jim Dandy, G3 Southwest, 3rd G1 BC Classic, 4th KY Derby.
  at_two:
    subtitle: Champion 2YO Male
    items:
    - Undefeated, won G1 Breeders' Futurity and G1 Breeder's Cup Juvenile.
progeny:
- 'THE PUMA (3c): won G3 Tampa Bay Derby on 3/7 (94), 2nd by a nose G1 Florida Derby 3/28 (100). 106 Ky Derby points. Scratched from Ky Derby.'
- 'BULL BY THE HORNS (3c): won Rushaway at TP 3/21 (70).'
- 'MY WORLD (3c): won Jerome at Aqu 1/3 (84); won Nashua at Aqu 11/1 (79). Brad Cox. $350k KeeSep. TDN Derby Dozen.'
- 'BLACK HORNET (3c): won Black Gold Stakes at FG 2/28 (85). Brendan Walsh/Calumet.'
- 'CHOPSTICKS (3f): won Ellis Park Debutante 8/10 (68); won MSW on debut at CD 6/27 (68). Brad Cox. $300k KeeSep.'
- 'ESSENTIAL TIME (3g): won Clever Trevor S. at Remington 9/28 (68).'
- 'EZUM (3c): won MSW by 20 at Colonial 3/14 (87). Brad Cox/Shadwell.'
- 'CONFESSIONAL (3c): 3rd in Virginia Derby 3/14 (82). Brad Cox.'
